apply plugin: 'com.android.application'

// versionCode strictement croissant : le numéro de run CI quand
// disponible, sinon 1 (le pattern de l'app principale).
def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')?.isInteger()
        ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1

android {
    namespace 'cm.tasvpn.goalfree'
    compileSdk 34

    defaultConfig {
        applicationId "cm.tasvpn.goalfree"
        minSdk 21
        targetSdk 34
        // versionCode = le numéro de run CI (l'empreinte unique de chaque build)
        versionCode ciRunNumber
        versionName "1.0." + ciRunNumber
    }

    signingConfigs {
        release {
            // La CI décode TASMOL_KEYSTORE_B64 vers TASMOL_KEYSTORE_PATH
            // (le même pattern que l'app principale — le keystore partagé)
            def ksPath = System.getenv("TASMOL_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("TASMOL_KEY_PASSWORD")
                keyAlias System.getenv("TASMOL_KEY_ALIAS")
                keyPassword System.getenv("TASMOL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("TASMOL_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    // App 100% Java : pas de NDK requis (l'APK tourne sur armeabi-v7a
    // nativement — le bytecode Dalvik est indépendant de l'ABI).
}

dependencies {
    // ZÉRO dépendance externe : android.jar pur — le build minimal et rapide
}
