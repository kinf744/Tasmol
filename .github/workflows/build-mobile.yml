name: Build Mobile (Android APK, armv7)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  GOMOBILE_VERSION: v0.0.0-20240520174638-fa72addaaa1b
  GRADLE_VERSION: '8.7'

jobs:
  apk:
    name: Build Android APK (armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK + NDK (manual, skip deprecated tools pkg)
        run: |
          # ubuntu-latest runners ship a preinstalled Android SDK; the
          # android-actions/setup-android@v3 action is broken (it forces
          # `sdkmanager tools`, a package removed from current repos).
          # Install only what we need directly.
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Export NDK env
        run: |
          ls "$ANDROID_HOME/ndk/" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)
          echo "Detected NDK: $NDK_DIR"
          ls "$NDK_DIR/meta/platforms.json"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}"
          go install "golang.org/x/mobile/cmd/gobind@${{ env.GOMOBILE_VERSION }}"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Resolve Go modules (gomobile bind deps)
        run: |
          go get "golang.org/x/mobile@${{ env.GOMOBILE_VERSION }}"
          go mod tidy
          go mod verify

      - name: Bind vpn AAR (vpnlib + pholib durci, android/arm, armeabi-v7a)
        run: |
          mkdir -p android/app/libs
          export GOARM=7
          # -trimpath: noms de chemins sources absents du binaire final;
          # -s -w: symboles retirés. pholib embarque le plan de contrôle
          # (endpoints, crypto) construit à l'exécution — jamais lisible
          # via strings/radare2/Ghidra.
          gomobile bind \
            -target=android/arm \
            -androidapi 24 \
            -trimpath \
            -ldflags='-s -w -buildid=' \
            -o android/app/libs/vpnlib.aar \
            ./golib/vpnlib ./golib/pholib

      - name: Verify AAR
        run: |
          ls -lh android/app/libs/vpnlib.aar
          unzip -p android/app/libs/vpnlib.aar jni/armeabi-v7a/libgojni.so > /tmp/libgojni.so
          file /tmp/libgojni.so

      - name: Stage official binaries into jniLibs
        run: |
          ls -lh bin/armv7/
          bash scripts/fetch_android_bins.sh

      - name: Install Gradle
        run: |
          cd /tmp
          wget -q "https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip"
          unzip -q "gradle-${{ env.GRADLE_VERSION }}-bin.zip"
          echo "/tmp/gradle-${{ env.GRADLE_VERSION }}/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          file android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasvpn-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release (APK)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}