name: Build ARMv7 (armeabi-v7a)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: false
        type: string
      go_version:
        description: 'Go version'
        required: false
        default: '1.23'
        type: choice
        options:
          - '1.22'
          - '1.23'
          - '1.24'

env:
  GO_VERSION: ${{ github.event.inputs.go_version || '1.23' }}
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-armv7:
    name: Build Linux ARMv7 (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Download Go dependencies
        run: |
          go mod download
          go mod tidy
          go mod verify

      - name: Build ARMv7 binary
        run: |
          export GOOS=linux
          export GOARCH=arm
          export GOARM=7
          export CGO_ENABLED=1
          export CC=arm-linux-gnueabihf-gcc
          export CGO_CFLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16"
          export CGO_LDFLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16"
          
          VERSION="${{ env.VERSION }}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE"
          
          mkdir -p build/armv7
          go build -ldflags="$LDFLAGS" -o build/armv7/vpn-app ./cmd/vpn-app

      - name: Verify binary
        run: |
          file build/armv7/vpn-app
          ls -lh build/armv7/vpn-app
          ./build/armv7/vpn-app -version 2>&1 || true

      - name: Strip binary
        run: |
          arm-linux-gnueabihf-strip build/armv7/vpn-app 2>/dev/null || strip build/armv7/vpn-app
          ls -lh build/armv7/vpn-app

      - name: Create release archive
        run: |
          cd build/armv7
          tar -czf vpn-app-armv7-linux.tar.gz vpn-app
          sha256sum vpn-app-armv7-linux.tar.gz > vpn-app-armv7-linux.tar.gz.sha256
          cat vpn-app-armv7-linux.tar.gz.sha256
          cd ../..

      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-app-armv7
          path: |
            build/armv7/vpn-app
            build/armv7/vpn-app-armv7-linux.tar.gz
            build/armv7/vpn-app-armv7-linux.tar.gz.sha256
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/armv7/vpn-app
            build/armv7/vpn-app-armv7-linux.tar.gz
            build/armv7/vpn-app-armv7-linux.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}