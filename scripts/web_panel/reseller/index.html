<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revendeur - Panel Web 3XUI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; }
        .sidebar { width: 260px; background: #2c3e50; color: white; height: 100vh; position: fixed; padding: 20px 0; }
        .sidebar h3 { padding: 0 20px; margin-bottom: 30px; font-size: 18px; color: #7f8c8d; }
        .sidebar a { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; border-bottom: 1px solid #34495e; transition: background 0.3s; }
        .sidebar a:hover { background: #34495e; color: white; }
        .sidebar a.active { background: #667eea; color: white; }
        .main { margin-left: 260px; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #2c3e50; }
        .user-badge { background: #f39c12; color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
        .logout { color: #e74c3c; text-decoration: none; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #2c3e50; }
        .table-container { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; color: #7f8c8d; font-size: 13px; text-transform: uppercase; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background: #f5f7fa; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #f39c12; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-green { background: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>🔄 Revendeur</h3>
        <a href="#" class="active">Tableau de bord</a>
        <a href="#">Mes comptes</a>
        <a href="#">Créer un compte</a>
        <a href="#" class="logout" style="margin-top: 30px; display:block; text-align:center;">Déconnexion</a>
    </div>
    <div class="main">
        <div class="header">
            <h1>Tableau de bord Revendeur</h1>
            <div class="user-badge">Revendeur</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Quota data restant</h3>
                <div class="value" id="quota">0 Go</div>
            </div>
            <div class="stat-card">
                <h3>Configs restantes</h3>
                <div class="value" id="configs">0</div>
            </div>
            <div class="stat-card">
                <h3>Durée restante</h3>
                <div class="value" id="duree">0 jours</div>
            </div>
            <div class="stat-card">
                <h3>Comptes clients</h3>
                <div class="value" id="clients">0</div>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Utilisateur</th>
                        <th>Serveur</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="clientsTable">
                    <tr><td colspan="5">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function loadComptes() {
            try {
                const res = await fetch('/api/vpn_configs');
                const data = await res.json();
                const tbody = document.getElementById('clientsTable');
                tbody.innerHTML = '';
                data.configs.forEach((c, i) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${c.id}</td>
                        <td>${c.ssh_user || 'N/A'}</td>
                        <td>${c.server_address}</td>
                        <td><span class="badge badge-green">Actif</span></td>
                        <td><button class="btn btn-danger">Supprimer</button></td>
                    `;
                    tbody.appendChild(row);
                });
                document.getElementById('clients').textContent = data.configs.length;
            } catch (err) {
                console.error(err);
            }
        }
        loadComptes();
        setInterval(loadComptes, 30000);
    </script>
</body>
</html>
