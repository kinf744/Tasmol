<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Panel Web 3XUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-dark { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-gradient:hover { background: linear-gradient(135deg, #5568d3 0%, #6a5acd 100%); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-4">
        <div class="glass rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Borum VPN</h1>
                <p class="text-slate-500 text-sm mt-2">Panneau Web 3XUI</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div class="form-group">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Identifiant</label>
                    <input type="text" id="username" value="admin" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-400 focus:outline-none transition-all" placeholder="admin">
                </div>
                <div class="form-group">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
                    <div class="relative">
                        <input type="password" id="password" value="admin" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-400 focus:outline-none transition-all pr-10" placeholder="••••••••">
                        <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-eye" id="password-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full btn-gradient text-white font-semibold py-3 px-4 rounded-lg hover:shadow-lg transition-all duration-200">
                    Se connecter
                </button>
            </form>
            <div id="error" class="hidden mt-4 p-3 rounded-lg bg-red-50 text-red-600 text-sm border border-red-100"></div>
            <div class="mt-6 pt-6 border-t border-slate-200">
                <p class="text-sm text-slate-500 text-center">© 2026 Borum VPN - Panneau Web 3XUI</p>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(inputId + '-eye');
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                if (res.ok) {
                    const data = await res.json();
                    window.location.href = data.role === 'admin' ? '/admin' : '/reseller';
                } else {
                    const err = await res.json();
                    errorEl.textContent = err.error || 'Identifiants invalides';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Erreur de connexion au serveur';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
